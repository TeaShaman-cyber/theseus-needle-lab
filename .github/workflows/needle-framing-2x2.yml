name: Needle framing 2x2

on:
  push:
    branches:
      - experiment/needle-framing-2x2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEEDLE_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned Needle runtime
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results logs metrics
          python -m pip install "cactus-needle==2.0.8" 2>&1 | tee logs/install.log
          python - <<'PY' | tee logs/package-versions.log
          import importlib.metadata, platform
          print('python=' + platform.python_version())
          for name in ['cactus-needle','huggingface-hub']:
              print(f'{name}={importlib.metadata.version(name)}')
          PY

      - name: Run direct grammar canaries
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v -o metrics/canaries.time \
            python scripts/run_framing_probe.py \
              --canaries \
              --output results/canaries.jsonl \
              --max-new-tokens 256 \
            2>&1 | tee logs/canaries.log

      - name: Run arm A bare schema declarative query
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v -o metrics/arm-a.time \
            python scripts/run_framing_probe.py \
              --arm A \
              --training-jsonl experiments/needle-cpu-smoke/data.jsonl \
              --output results/arm-a.jsonl \
              --max-new-tokens 256 \
            2>&1 | tee logs/arm-a.log

      - name: Run arm B bare schema explicit classification prefix
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v -o metrics/arm-b.time \
            python scripts/run_framing_probe.py \
              --arm B \
              --training-jsonl experiments/needle-cpu-smoke/data.jsonl \
              --output results/arm-b.jsonl \
              --max-new-tokens 256 \
            2>&1 | tee logs/arm-b.log

      - name: Run arm C described schema declarative query
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v -o metrics/arm-c.time \
            python scripts/run_framing_probe.py \
              --arm C \
              --training-jsonl experiments/needle-cpu-smoke/data.jsonl \
              --output results/arm-c.jsonl \
              --max-new-tokens 256 \
            2>&1 | tee logs/arm-c.log

      - name: Run arm D described schema explicit classification prefix
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v -o metrics/arm-d.time \
            python scripts/run_framing_probe.py \
              --arm D \
              --training-jsonl experiments/needle-cpu-smoke/data.jsonl \
              --output results/arm-d.jsonl \
              --max-new-tokens 256 \
            2>&1 | tee logs/arm-d.log

      - name: Write framing receipt
        shell: bash
        run: |
          set -eu
          python scripts/framing_probe_receipt.py \
            --canaries results/canaries.jsonl \
            --arm-a results/arm-a.jsonl \
            --arm-b results/arm-b.jsonl \
            --arm-c results/arm-c.jsonl \
            --arm-d results/arm-d.jsonl \
            --commit "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --output results/receipt.json \
            --markdown results/summary.md
          cat results/summary.md
          cat results/receipt.json

      - name: Assert evidence shape only
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          def rows(name):
              return [json.loads(x) for x in pathlib.Path(name).read_text().splitlines() if x.strip()]
          assert len(rows('results/canaries.jsonl')) == 3
          for arm in 'abcd':
              r = rows(f'results/arm-{arm}.jsonl')
              assert len(r) == 12
              assert len({x['id'] for x in r}) == 12
          receipt = json.loads(pathlib.Path('results/receipt.json').read_text())
          assert receipt['schema'] == 'theseus.needle.framing_probe.v1'
          assert set(receipt['arms']) == set('ABCD')
          print('EVIDENCE_SHAPE=PASS')
          PY

      - name: Upload framing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: needle-framing-2x2-${{ github.run_id }}
          path: |
            results/
            logs/
            metrics/
          if-no-files-found: error
