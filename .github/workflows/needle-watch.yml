name: Collect Needle Watch discovery receipts

on:
  workflow_dispatch:
  schedule:
    - cron: "37 14 * * *"

permissions:
  contents: write

concurrency:
  group: needle-watch-${{ github.ref }}
  queue: max

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run contract tests
        run: python -m unittest discover -s tests -v

      - name: Collect public discovery candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDLE_WATCH_RUN_ID: ${{ github.run_id }}-attempt-${{ github.run_attempt }}
          NEEDLE_WATCH_COLLECTOR_REVISION: ${{ github.sha }}
        run: python scripts/collect-needle-watch.py

      - name: Commit validated receipt snapshots
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runs data/daily data/latest
          if git diff --cached --quiet; then
            echo "No receipt changes to commit."
          else
            git commit -m "Collect Needle Watch discovery receipt"
            git push
          fi
