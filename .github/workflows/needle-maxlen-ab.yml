name: Needle max-len A/B

on:
  push:
    branches:
      - experiment/needle-maxlen-ab
  workflow_dispatch:

permissions:
  contents: read

env:
  NEEDLE_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SEED: "0"

jobs:
  paired-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned Needle
        shell: bash
        run: |
          set -eu
          mkdir -p checkpoints artifacts results logs metrics
          python -m pip install "cactus-needle==2.0.8" 2>&1 | tee logs/install.log
          python - <<'PY' | tee logs/package-versions.log
          import importlib.metadata, platform
          print('python=' + platform.python_version())
          for name in ['cactus-needle','jax','jaxlib','flax','optax','sentencepiece','huggingface-hub']:
              print(f'{name}={importlib.metadata.version(name)}')
          PY

      - name: Download and verify exact Needle 2 checkpoint
        shell: bash
        run: |
          set -eu
          python - <<'PY' 2>&1 | tee logs/checkpoint-download.log
          from huggingface_hub import hf_hub_download
          print(hf_hub_download('Cactus-Compute/needle2','checkpoints/needle2.pkl',repo_type='model',local_dir='.'))
          PY
          expected=4b0a972d163ffc7678fb3c36bace508114872e9d2ce9e10f225825752d3795bc
          actual=$(sha256sum checkpoints/needle2.pkl | awk '{print $1}')
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Measure target coverage for both arms
        shell: bash
        run: |
          set -eu
          python scripts/target_coverage.py \
            --data experiments/needle-cpu-smoke/data.jsonl \
            --cap 128 \
            --output results/coverage-a.json
          python scripts/target_coverage.py \
            --data experiments/needle-cpu-smoke/data.jsonl \
            --cap 1024 \
            --output results/coverage-b.json \
            --assert-full-training-targets
          cat results/coverage-a.json
          cat results/coverage-b.json

      - name: Assert full training targets (assert_full_training_targets)
        shell: bash
        run: |
          set -eu
          python - <<'PY'
          import json
          a=json.load(open('results/coverage-a.json'))
          b=json.load(open('results/coverage-b.json'))
          assert a['summary']['training_truncated_rows'] == [7, 9, 12]
          assert b['summary']['training_truncated_rows'] == []
          assert a['validation_rows'] == b['validation_rows'] == [10]
          assert a['effective_max_len'] == 128
          assert b['effective_max_len'] > a['effective_max_len']
          PY

      - name: Fine-tune arm A at max_len 128 with fixed shuffle seed
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v -o metrics/finetune-a.time \
            python scripts/run_seeded_finetune.py experiments/needle-cpu-smoke/data.jsonl \
              --checkpoint checkpoints/needle2.pkl \
              --seed 0 \
              --epochs 1 \
              --batch-size 2 \
              --lr 1e-4 \
              --lora-rank 4 \
              --lora-alpha 32 \
              --max-len 128 \
              --out artifacts/adapter-a.pkl \
            2>&1 | tee logs/finetune-a.log

      - name: Fine-tune arm B at upstream max_len cap with fixed shuffle seed
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v -o metrics/finetune-b.time \
            python scripts/run_seeded_finetune.py experiments/needle-cpu-smoke/data.jsonl \
              --checkpoint checkpoints/needle2.pkl \
              --seed 0 \
              --epochs 1 \
              --batch-size 2 \
              --lr 1e-4 \
              --lora-rank 4 \
              --lora-alpha 32 \
              --max-len 1024 \
              --out artifacts/adapter-b.pkl \
            2>&1 | tee logs/finetune-b.log

      - name: Build uniform W4 artifacts
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v -o metrics/build-a.time needle build checkpoints/needle2.pkl --lora artifacts/adapter-a.pkl --bits 4 --out artifacts/a-w4.cact 2>&1 | tee logs/build-a.log
          /usr/bin/time -v -o metrics/build-b.time needle build checkpoints/needle2.pkl --lora artifacts/adapter-b.pkl --bits 4 --out artifacts/b-w4.cact 2>&1 | tee logs/build-b.log
          sha256sum artifacts/adapter-a.pkl artifacts/adapter-b.pkl artifacts/a-w4.cact artifacts/b-w4.cact | tee metrics/artifacts.sha256

      - name: Replay training set on both arms
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_policy_eval.py --training-jsonl experiments/needle-cpu-smoke/data.jsonl --output results/train-a.jsonl --model-id maxlen-128 --max-new-tokens 256 --weights artifacts/a-w4.cact 2>&1 | tee logs/train-a.log
          python scripts/run_policy_eval.py --training-jsonl experiments/needle-cpu-smoke/data.jsonl --output results/train-b.jsonl --model-id maxlen-full --max-new-tokens 256 --weights artifacts/b-w4.cact 2>&1 | tee logs/train-b.log

      - name: Evaluate held-out set on both arms
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_policy_eval.py --cases experiments/needle-policy-eval/cases.jsonl --output results/heldout-a.jsonl --model-id maxlen-128 --max-new-tokens 256 --weights artifacts/a-w4.cact 2>&1 | tee logs/heldout-a.log
          python scripts/run_policy_eval.py --cases experiments/needle-policy-eval/cases.jsonl --output results/heldout-b.jsonl --model-id maxlen-full --max-new-tokens 256 --weights artifacts/b-w4.cact 2>&1 | tee logs/heldout-b.log

      - name: Write A/B receipt
        shell: bash
        run: |
          set -eu
          python scripts/maxlen_ab_receipt.py \
            --train-a results/train-a.jsonl --train-b results/train-b.jsonl \
            --heldout-a results/heldout-a.jsonl --heldout-b results/heldout-b.jsonl \
            --coverage-a results/coverage-a.json --coverage-b results/coverage-b.json \
            --adapter-a artifacts/adapter-a.pkl --adapter-b artifacts/adapter-b.pkl \
            --cact-a artifacts/a-w4.cact --cact-b artifacts/b-w4.cact \
            --seed "$SEED" --output results/receipt.json --markdown results/summary.md
          cat results/summary.md
          cat results/receipt.json

      - name: Assert experiment contract
        shell: bash
        run: |
          set -eu
          python - <<'PY'
          import json
          r=json.load(open('results/receipt.json'))
          assert r['schema'] == 'theseus.needle.maxlen_ab.v1'
          assert r['config']['seed'] == 0
          assert r['config']['epochs'] == 1
          assert r['config']['batch_size'] == 2
          assert r['config']['lr'] == 1e-4
          assert r['config']['lora_rank'] == 4
          assert r['config']['lora_alpha'] == 32.0
          assert r['config']['export_bits'] == 4
          assert r['config']['max_new_tokens'] == 256
          assert r['arms']['a']['max_len_cap'] == 128
          assert r['arms']['a']['training_truncated_rows'] == [7,9,12]
          assert r['arms']['b']['max_len_cap'] == 1024
          assert r['arms']['b']['training_truncated_rows'] == []
          assert r['train_comparison']['base']['n'] == 12
          assert r['train_comparison']['tuned']['n'] == 12
          assert r['heldout_comparison']['base']['n'] == 24
          assert r['heldout_comparison']['tuned']['n'] == 24
          PY

      - name: Upload paired experiment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: needle-maxlen-ab-${{ github.run_id }}
          path: |
            artifacts/
            results/
            logs/
            metrics/
          if-no-files-found: error
          retention-days: 14
