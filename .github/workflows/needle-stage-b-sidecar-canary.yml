name: Needle Stage B sidecar canary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experiments/needle-realistic-sft/verification/**"
      - "scripts/stage_b_acceptance_sidecar.py"
      - "scripts/stage_b_scipy_diagnostics.py"
      - "scripts/stage_b_wolfram_canary.mjs"
      - "tests/test_stage_b_sidecars.py"
      - ".github/workflows/needle-stage-b-sidecar-canary.yml"

permissions:
  contents: read


jobs:
  verify-sidecars:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run sidecar contract tests
        run: python -m unittest tests.test_stage_b_sidecars -v
      - name: Build local discrete and applicability receipt
        run: |
          python scripts/stage_b_acceptance_sidecar.py \
            --claim experiments/needle-realistic-sft/verification/stage-b-acceptance-canary.json \
            --output experiments/needle-realistic-sft/verification/generated/local-canary-receipt.json
      - name: Install pinned SciPy diagnostic runtime
        run: python -m pip install --disable-pip-version-check scipy==1.18.1
      - name: Run SciPy diagnostic sidecar
        run: |
          python scripts/stage_b_scipy_diagnostics.py \
            --claim experiments/needle-realistic-sft/verification/stage-b-acceptance-canary.json \
            --output experiments/needle-realistic-sft/verification/generated/scipy-canary-receipt.json
      - name: Install locked Wolfram MCP client
        run: npm ci --ignore-scripts --prefix verification/stage-b-sidecars/wolfram
      - name: Run Wolfram MCP exact acceptance witness
        run: |
          node scripts/stage_b_wolfram_canary.mjs \
            experiments/needle-realistic-sft/verification/stage-b-acceptance-canary.json \
            experiments/needle-realistic-sft/verification/generated/wolfram-canary-receipt.json \
            experiments/needle-realistic-sft/verification/generated/wolfram-canary-raw.json
      - name: Upload sidecar evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: needle-stage-b-sidecar-canary
          path: experiments/needle-realistic-sft/verification/generated/
          if-no-files-found: error
          retention-days: 30
