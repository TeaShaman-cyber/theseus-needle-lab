name: Needle 3 deployment canary

on:
  workflow_dispatch:
    inputs:
      experiment_sha:
        description: Exact 40-hex commit to execute
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: needle3-deployment-canary-${{ inputs.experiment_sha }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPERIMENT_SHA: ${{ inputs.experiment_sha }}
      LAUNCHER_SHA: ${{ github.workflow_sha }}
      PYTHONUNBUFFERED: "1"
      JAX_PLATFORM_NAME: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"

    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.experiment_sha }}
          fetch-depth: 1

      - name: Verify exact revision and launcher identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPERIMENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LAUNCHER_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPERIMENT_SHA"
          echo "EXACT_REVISION_PASS experiment_sha=$actual launcher_sha=$LAUNCHER_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Repository QA gate
        run: tools/dev/check

      - name: Prepare evidence directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _inputs _outputs _canary/results _canary/provenance _canary/environment _evidence/faults

      - name: Install exact Needle release and training dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_needle3_canary_stage.sh setup             --artifact-root _inputs             --track _inputs             -- bash -lc '
              set -euo pipefail
              python3 -m pip download --no-deps --only-binary=:all: cactus-needle==3.0.4 -d _inputs
              python3 scripts/needle3_deployment_canary.py verify-wheel                 --wheel _inputs/cactus_needle-3.0.4-py3-none-any.whl
              python3 -m pip install --only-binary=:all: --require-hashes                 -r experiments/needle3-deployment-canary/v1/requirements.lock.txt
              python3 -c "import importlib.metadata; observed=importlib.metadata.version(\"cactus-needle\"); assert observed==\"3.0.4\", observed; print(\"PACKAGE_VERSION_PASS=\"+observed)"
              python3 --version > _canary/environment/python-version.txt
              python3 -m pip freeze > _canary/environment/pip-freeze.txt
              uname -a > _canary/environment/uname.txt
            '

      - name: Download exact base checkpoint
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_needle3_canary_stage.sh download_checkpoint             --artifact-root _inputs/checkpoints             --track _inputs/checkpoints             -- needle download needle3.safetensors --out _inputs

      - name: Verify frozen base checkpoint identity
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_needle3_canary_stage.sh verify_base_checkpoint             --artifact-root _canary/environment/base-checkpoint-identity.json             --track _canary/environment             -- python3 scripts/needle3_deployment_canary.py verify-base-checkpoint               --checkpoint _inputs/checkpoints/needle3.safetensors               --output _canary/environment/base-checkpoint-identity.json

      - name: Resolve exact runtime engine
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_needle3_canary_stage.sh resolve_engine             --artifact-root _canary/environment             --track "$HOME/.cache/cactus-needle"             -- python3 scripts/needle3_deployment_canary.py resolve-engine               --output _canary/environment/engine-path.txt               --identity-output _canary/environment/engine-identity.json

      - name: Evaluate base reference
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_needle3_canary_stage.sh base_reference             --artifact-root _canary/results/base_reference.jsonl             --track _canary/results             -- python3 scripts/needle3_deployment_canary.py run-reference               --checkpoint _inputs/checkpoints/needle3.safetensors               --max-new-tokens 128               --output _canary/results/base_reference.jsonl

      - name: Train bounded local LoRA
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_needle3_canary_stage.sh train             --artifact-root _outputs/canary_lora.safetensors             --track _outputs             -- needle finetune experiments/needle3-deployment-canary/v1/train.jsonl               --checkpoint _inputs/checkpoints/needle3.safetensors               --epochs 2               --batch-size 8               --lr 0.0001               --lora-rank 8               --lora-alpha 16               --max-len 512               --val-split 0               --seed 0               --out _outputs/canary_lora.safetensors               --checkpoint-dir _outputs/checkpoints

      - name: Evaluate merged-LoRA reference
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_needle3_canary_stage.sh lora_reference             --artifact-root _canary/results/lora_reference.jsonl             --track _canary/results             -- python3 scripts/needle3_deployment_canary.py run-reference               --checkpoint _inputs/checkpoints/needle3.safetensors               --lora _outputs/canary_lora.safetensors               --max-new-tokens 128               --output _canary/results/lora_reference.jsonl

      - name: Build deployed cact
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_needle3_canary_stage.sh build             --artifact-root _outputs/tuned.cact             --track _outputs             --track "$HOME/.cache/cactus-needle"             -- needle build _inputs/checkpoints/needle3.safetensors               --lora _outputs/canary_lora.safetensors               --out _outputs/tuned.cact

      - name: Verify pinned published base cact used by build
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_needle3_canary_stage.sh verify_base_cact             --artifact-root _canary/environment/base-cact-identity.json             --track _canary/environment             --track "$HOME/.cache/cactus-needle"             -- python3 scripts/needle3_deployment_canary.py resolve-published-base-cact               --output _canary/environment/base-cact-path.txt               --identity-output _canary/environment/base-cact-identity.json

      - name: Emit typed missing-artifact evidence if build did not produce cact
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f _evidence/telemetry/build/checkpoint.json ] && [ ! -f _outputs/tuned.cact ]; then
            python3 scripts/needle3_deployment_canary.py missing-artifact-fault               --surface built_cact               --expected-artifact _outputs/tuned.cact               --checkpoint _evidence/telemetry/build/checkpoint.json               --output _evidence/faults/built-cact-missing.json
            exit 1
          fi

      - name: Evaluate built cact
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_needle3_canary_stage.sh built_cact             --artifact-root _canary/results/built_cact.jsonl             --track _canary/results             --track "$HOME/.cache/cactus-needle"             -- python3 scripts/needle3_deployment_canary.py run-built               --weights _outputs/tuned.cact               --max-new-tokens 128               --output _canary/results/built_cact.jsonl

      - name: Bind surface provenance
        shell: bash
        run: |
          set -euo pipefail
          engine="$(cat _canary/environment/engine-path.txt)"
          base_cact="$(cat _canary/environment/base-cact-path.txt)"
          bash scripts/run_needle3_canary_stage.sh provenance             --artifact-root _canary/provenance             --track _canary/provenance             -- bash -lc "
              set -euo pipefail
              python3 scripts/needle3_deployment_canary.py make-provenance                 --surface base_reference                 --package-wheel _inputs/cactus_needle-3.0.4-py3-none-any.whl                 --base-checkpoint _inputs/checkpoints/needle3.safetensors                 --output _canary/provenance/base_reference.json
              python3 scripts/needle3_deployment_canary.py make-provenance                 --surface lora_reference                 --package-wheel _inputs/cactus_needle-3.0.4-py3-none-any.whl                 --base-checkpoint _inputs/checkpoints/needle3.safetensors                 --lora-adapter _outputs/canary_lora.safetensors                 --output _canary/provenance/lora_reference.json
              python3 scripts/needle3_deployment_canary.py make-provenance                 --surface built_cact                 --package-wheel _inputs/cactus_needle-3.0.4-py3-none-any.whl                 --base-checkpoint _inputs/checkpoints/needle3.safetensors                 --lora-adapter _outputs/canary_lora.safetensors                 --built-cact _outputs/tuned.cact                 --engine-binary '$engine'                 --published-base-cact '$base_cact'                 --output _canary/provenance/built_cact.json
            "

      - name: Aggregate bounded canary receipt
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_needle3_canary_stage.sh aggregate             --artifact-root _canary/receipt.json             --track _canary             -- python3 scripts/needle3_deployment_canary.py aggregate               --base-results _canary/results/base_reference.jsonl               --lora-results _canary/results/lora_reference.jsonl               --built-results _canary/results/built_cact.jsonl               --base-provenance _canary/provenance/base_reference.json               --lora-provenance _canary/provenance/lora_reference.json               --built-provenance _canary/provenance/built_cact.json               --output _canary/receipt.json

      - name: Print bounded result
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json; r=json.load(open("_canary/receipt.json", encoding="utf-8")); print("NEEDLE3_CANARY_DISPOSITION="+r["disposition"]); print("NEEDLE3_CANARY_REASONS="+",".join(r["disposition_reasons"])); print("NEEDLE3_CANARY_DEPLOYMENT_MISMATCHES="+str(r["lora_reference_vs_built_cact"]["prediction_mismatch_count"]))'

      - name: Upload canary evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: needle3-deployment-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _canary/
            _evidence/
            _outputs/canary_lora.safetensors
            _outputs/tuned.cact
          if-no-files-found: warn
          retention-days: 14

  readback:
    needs: produce
    if: ${{ always() && needs.produce.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPERIMENT_SHA: ${{ inputs.experiment_sha }}

    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.experiment_sha }}
          fetch-depth: 1

      - name: Verify exact revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPERIMENT_SHA"
          echo "READBACK_EXACT_REVISION_PASS=$actual"

      - name: Download exact run-attempt evidence
        uses: actions/download-artifact@v4
        with:
          name: needle3-deployment-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Validate uploaded stage evidence
        shell: bash
        run: |
          set -euo pipefail
          for stage in verify_base_checkpoint resolve_engine base_reference train lora_reference build verify_base_cact built_cact provenance aggregate; do
            python3 scripts/execution_telemetry.py validate               --checkpoint "_evidence/telemetry/$stage/checkpoint.json"               --heartbeat "_evidence/telemetry/$stage/heartbeat.jsonl"               --root .               --expected-execution-status SUCCEEDED               --expected-lifecycle-state ARTIFACT_PROVENANCE
          done
          echo NEEDLE3_STAGE_READBACK_PASS

      - name: Rebuild and validate scientific receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/needle3_deployment_canary.py validate-receipt             --receipt _canary/receipt.json             --base-results _canary/results/base_reference.jsonl             --lora-results _canary/results/lora_reference.jsonl             --built-results _canary/results/built_cact.jsonl             --base-provenance _canary/provenance/base_reference.json             --lora-provenance _canary/provenance/lora_reference.json             --built-provenance _canary/provenance/built_cact.json
          echo NEEDLE3_CANARY_READBACK_PASS
