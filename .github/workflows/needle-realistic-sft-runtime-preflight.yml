name: Needle realistic SFT runtime preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experiments/needle-realistic-sft/**"
      - "scripts/audit_realistic_sft_token_lengths.py"
      - ".github/workflows/needle-realistic-sft-runtime-preflight.yml"

permissions:
  contents: read

env:
  NEEDLE_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  runtime-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned Needle runtime
        shell: bash
        run: |
          set -eu
          mkdir -p results logs
          python -m pip install "cactus-needle[train]==2.0.8" 2>&1 | tee logs/install.log
          python - <<'PY' | tee logs/package-versions.log
          import importlib.metadata, platform
          print('python=' + platform.python_version())
          for name in ['cactus-needle','sentencepiece','huggingface-hub']:
              print(f'{name}={importlib.metadata.version(name)}')
          PY
      - name: Verify committed dataset contract
        run: python3 scripts/validate_realistic_sft_dataset.py
      - name: Audit exact Needle-rendered token lengths
        shell: bash
        run: |
          set -eu
          python3 scripts/audit_realistic_sft_token_lengths.py \
            --max-len 256 \
            --output results/token-length-audit.json
          python3 - <<'PY'
          import json
          r=json.load(open('results/token-length-audit.json'))
          assert r['status'] == 'VERIFIED_ZERO_TRUNCATION'
          assert r['row_count'] == 360
          assert r['truncated_case_ids'] == []
          print('TOKEN_LENGTH_AUDIT=PASS')
          print('MAX_OBSERVED_TOKENS=' + str(r['max_observed_tokens']))
          print('TOKENIZER_SHA256=' + r['runtime']['tokenizer_model_sha256'])
          PY
      - name: Upload runtime preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: needle-realistic-sft-runtime-preflight-${{ github.run_id }}
          path: |
            results/
            logs/
          if-no-files-found: error
          retention-days: 14
